volumes:
  phoebe-data:
    driver: local
    driver_opts:
      type: none
      device: ./data
      o: bind
  phoebe-uploads:
    driver: local
    driver_opts:
      type: none
      device: ./uploads
      o: bind
  phoebe-logs:
    driver: local
  # postgres-data:
  #   driver: local

networks:
  phoebe-network:
    driver: bridge