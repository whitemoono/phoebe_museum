services:
  phoebe-museum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phoebe-museum
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - JWT_SECRET=${JWT_SECRET:-your-jwt-secret-key-change-in-production}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_NAME=Phoebe Museum
      - UPLOAD_DIR=/app/public/uploads
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@phoebe-museum.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123456}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
    volumes:
      # 持久化数据库
      - phoebe-data:/app/prisma
      # 持久化上传文件
      - phoebe-uploads:/app/public/uploads
      # 持久化日志
      - phoebe-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - phoebe-network

  # 可选：PostgreSQL 数据库（生产环境推荐）
