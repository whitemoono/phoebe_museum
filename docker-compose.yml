  #   networks:
  #     - phoebe-network

  # 可选：Nginx 反向代理（生产环境）
  # nginx:
  #   image: nginx:alpine
  #   container_name: phoebe-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #     - ./nginx/ssl:/etc/nginx/ssl
  #     - phoebe-uploads:/usr/share/nginx/html/uploads
  #   depends_on:
  #     - phoebe-museum
